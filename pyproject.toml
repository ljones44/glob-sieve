[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globsieve"
version = "0.1.0"
description = "Filter a list of paths against a glob pattern, reading from files or stdin"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "ljones44"}]

[project.scripts]
globsieve = "globsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
